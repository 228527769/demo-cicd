name: .NET CI/CD

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 7.0.x
    
    - name: Restore
      run: dotnet restore DemoApp/DemoApp.sln
    
    - name: Build
      run: dotnet build DemoApp/DemoApp.sln -c Release --no-restore
    
    - name: Test
      run: dotnet test DemoApp/DemoApp.sln -c Release --no-build
